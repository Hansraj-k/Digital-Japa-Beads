<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japa Counter Widget</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="widget.js"></script>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #counter {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        button {
            font-size: 1.5rem;
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div id="counter">0</div>
    <button id="count-btn">+1</button>
    <button id="reset-count">Reset Count</button>
    <button id="reset-round">Reset Round</button>
</body>
</html>
